name: toolbox
version: "0.11.9"
summary: Swiss knife of shell tools
description: |
  Set of useful shell tools to be used on Ubuntu/Ubuntu core systems.
  After installation run the following commands to enable all built-in tools in your shell:
  $ toolbox.set-path >> ~/.bashrc
  Log out and log back in, or run $ source ~/.bashrc

  Now all included tools should be in your path, and running unconfined :)
  This is a one-time setup, when new tools are added they are automatically included in the path.

confinement: strict
grade: stable
platforms:
  armhf:
  arm64:
  amd64:
  riscv64:

base: core26

environment:
  PATH:            ${SNAP}/usr/sbin:${SNAP}/usr/bin:$PATH
  LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}:${LD_LIBRARY_PATH}:${SNAP}/lib:${SNAP}/usr/lib:${SNAP}/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}:${SNAP}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
  ARCH_TRIPLET:    ${CRAFT_ARCH_TRIPLET_BUILD_FOR}

apps:
  help:
    command: usr/bin/toolbox-help

  set-path:
    command: usr/bin/set-path

parts:
  tools:
    source: glue
    plugin: dump
    stage-packages:
      - abootimg
      - bash
      - bash-completion
      - bc
      - binutils
      - bsdiff
      - bsdmainutils
      - busybox-static
      - byobu
      - cpio
      - cpu-checker
      - curl
      - device-tree-compiler
      - devmem2
      - dmsetup
      - dnsutils
      - efibootmgr
      - efitools
      - ethtool
      - file
      - fio
      - gdb
      - gdisk
      - gpiod
      - grub-common
      - hdparm
      - htop
      - httpie
      - i2c-tools
      - icdiff
      - initramfs-tools-core
      - iotop
      - iperf3
      - iw
      - jq
      - keyutils
      - libdb5.3t64
      - libgpm2
      - liblz4-1
      - libmagic1t64
      - libonig5
      - libparted2t64
      - libslang2
      - libubootenv-tool
      - libusb-1.0-0
      - linux-tools-common
      - lm-sensors
      - lshw
      - lsof
      - lz4
      - minicom
      - mkbootimg
      - mmc-utils
      - mokutil
      - mtd-utils
      - nano
      - netdiscover
      - net-tools
      - parted
      - pastebinit
      - pciutils
      - perl
      - ppp
      - psmisc
      - pv
      - rhash
      - rng-tools5
      - rsync
      - rt-tests
      - screen
      - silversearcher-ag
      - smartmontools
      - ssh-import-id
      - strace
      - stress-ng
      - tcpdump
      - time
      - tmux
      - tree
      - unzip
      - usbutils
      - util-linux
      - vim
      - vim-common
      - vim-runtime
      - vim-tiny
      - watchdog
      - wget
      - xz-utils
      - zip
      - on amd64,arm64,armhf:
        - sysbench
    stage:
      - -bin/bash
      - -usr/bin/py*
      - -usr/lib/*/libdrm_*
      - -usr/lib/*/libgallium*
      - -usr/lib/*/libLLVM*
      - -usr/lib/gcc
      - -usr/lib/klibc*
      - -usr/lib/python3/dist-packages/R*
      - -usr/lib/python3/dist-packages/c*
      - -usr/lib/python3/dist-packages/h*
      - -usr/lib/python3/dist-packages/idna*
      - -usr/lib/python3/dist-packages/pygments
      - -usr/lib/python3/dist-packages/r*
      - -usr/lib/python3/dist-packages/six*
      - -usr/lib/python3/dist-packages/u*
      - -usr/lib/python3.*
      - -usr/share/doc
      - -usr/share/locale
      - -usr/share/man/
      - -usr/share/python*
      - -usr/share/vim
      # make sure we do not have pulled in lsb_release, it makes no sense
      - -usr/bin/lsb_release
    override-build: |
      # first clean files from stage packages we want override
      for f in ${CRAFT_PART_INSTALL}/usr/share/bash-completion/completions/ssh
      do
        if [ -e ${f} ]; then
          rm -rf ${f}
        fi
      done
      craftctl default
      echo "Checking if usr/bin/peekfd exists"
      # interestingly on arm64 there is no usr/bin/peekfd, account for this
      if [ ! -f ${CRAFT_PART_INSTALL}/usr/bin/peekfd ]; then
        echo "adding stub for usr/bin/peekfd"
        echo "#!/bin/bash" > ${CRAFT_PART_INSTALL}/usr/bin/peekfd
        echo "echo 'peekfd is not supported on arm64'" >> ${CRAFT_PART_INSTALL}/usr/bin/peekfd
        chmod +x ${CRAFT_PART_INSTALL}/usr/bin/peekfd
      fi
      sed -i \
          -e 's|/usr/share/bash-completion|${SNAP_TOOLBOX}/usr/share/bash-completion|g' \
          ${CRAFT_PART_INSTALL}/etc/profile.d/bash_completion.sh
      # source lxd bash completion if present
      echo "[ -f /snap/lxd/current/etc/bash_completion.d/snap.lxd.lxc ] && . /snap/lxd/current/etc/bash_completion.d/snap.lxd.lxc" \
         >> ${CRAFT_PART_INSTALL}/etc/profile.d/bash_completion.sh
      # source git-ondra bash completion if present
      echo "[ -f /snap/git-ondra/current/git-completion.bash ] && . /snap/git-ondra/current/git-completion.bash" \
         >> ${CRAFT_PART_INSTALL}/etc/profile.d/bash_completion.sh
      # source custom ssh if present
      echo "[ -f /snap/toolbox/current/usr/share/bash-completion/completions/ssh ] && . /snap/toolbox/current/usr/share/bash-completion/completions/ssh" \
         >> ${CRAFT_PART_INSTALL}/etc/profile.d/bash_completion.sh
      # fix pastebin to work with toolbox snap install
      sed -i \
          -e 's|/usr/local/etc/pastebin.d|/snap/toolbox/current/usr/share/pastebin.d|g' \
          -e 's/defaultPB = "pastebin.com"/defaultPB = "paste.ubuntu.com"/g' \
          ${CRAFT_PART_INSTALL}/usr/bin/pastebinit
      # fix ssh_import_id search path for etc/ssh/ssh_import_id
      sed -i \
          -e 's|\(conf_file = "\)\(.*\)|\1/snap/toolbox/current\2|g' \
          ${CRAFT_PART_INSTALL}/usr/lib/python3/dist-packages/ssh_import_id/__init__.py
      # merge {s}bin/,lib, to usr/{s}bin, usr/lib
      [ -d "${CRAFT_PART_INSTALL}/bin" ]  && mv "${CRAFT_PART_INSTALL}"/bin/*     "${CRAFT_PART_INSTALL}/usr/bin"
      [ -d "${CRAFT_PART_INSTALL}/sbin" ] && mv "${CRAFT_PART_INSTALL}"/sbin/*    "${CRAFT_PART_INSTALL}/usr/sbin"
      [ -d "${CRAFT_PART_INSTALL}/lib" ]  && cp -rl "${CRAFT_PART_INSTALL}"/lib/* "${CRAFT_PART_INSTALL}/usr/lib"
      rm -rf "${CRAFT_PART_INSTALL}/bin"   "${CRAFT_PART_INSTALL}/sbin" "${CRAFT_PART_INSTALL}/lib"
      ln -sf usr/bin  "${CRAFT_PART_INSTALL}/bin"
      ln -sf usr/sbin "${CRAFT_PART_INSTALL}/sbin"
      ln -sf usr/lib  "${CRAFT_PART_INSTALL}/lib"
    override-stage: |
      ${CRAFT_PROJECT_DIR}/clean-stage.sh -f \
            -i 'usr/share/bash-completion/completions usr/lib/python* etc/cloud/templates etc/profile.d/bash_completion.sh' \
            /snap/core26/current/ ${CRAFT_PART_INSTALL}
      craftctl default

  mc:
    source: https://github.com/MidnightCommander/mc.git
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=/snap/toolbox/current/usr
      - --sysconfdir=/var/snap/toolbox/common/etc
      - --without-x
    override-build: |
      craftctl default
      mv ${CRAFT_PART_INSTALL}/snap/toolbox/current/usr ${CRAFT_PART_INSTALL}/
      rm -rf ${CRAFT_PART_INSTALL}/snap
      mv ${CRAFT_PART_INSTALL}/var/snap/toolbox/common/etc ${CRAFT_PART_INSTALL}/
      rm -rf ${CRAFT_PART_INSTALL}/var

  macchanger:
    plugin: autotools
    source: https://github.com/alobbs/macchanger.git
    source-type: git
    autotools-configure-parameters:
      - --datadir=/snap/${CRAFT_PROJECT_NAME}/current/usr/share/
    organize:
      snap/${CRAFT_PROJECT_NAME}/current/usr/share/: usr/share/
    stage:
      - -snap/

  resty:
    plugin: nil
    source: https://github.com/micha/resty.git
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/bin
      cp pp pypp ${CRAFT_PART_INSTALL}/usr/bin
      cp resty ${CRAFT_PART_INSTALL}/usr/bin
      mkdir -p ${CRAFT_PART_INSTALL}/usr/share/bash-completion/completions/
      curl -o ${CRAFT_PART_INSTALL}/usr/share/bash-completion/completions/httpie https://raw.githubusercontent.com/jakubroztocil/httpie/master/extras/httpie-completion.bash

  mountinfo-tool:
    plugin: nil
    override-pull: |
      wget https://raw.githubusercontent.com/snapcore/snapd/master/tests/lib/tools/mountinfo.query
    override-build: |
      cp mountinfo.query ${CRAFT_PART_INSTALL}/
    organize:
      mountinfo.query: usr/bin/mountinfo.query

  lk-boot-env:
    plugin: nil
    override-pull: |
      craftctl default
      wget https://raw.githubusercontent.com/snapcore/snapd/master/include/lk/snappy_boot_common.h
      wget https://raw.githubusercontent.com/snapcore/snapd/master/include/lk/snappy_boot_v2.h
      wget https://raw.githubusercontent.com/kubiko/dragonboard-gadget/20-lk/snap-boot-sel/lk-boot-env.c
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/usr/bin
      gcc lk-boot-env.c -I/usr/include/ -Iapp/aboot -o ${CRAFT_PART_INSTALL}/usr/bin/lk-boot-env

  mosh:
    plugin: autotools
    source: https://github.com/mobile-shell/mosh.git
    source-type: git
    stage-packages:
      - libprotobuf32t64
    autotools-configure-parameters:
      - --prefix=/usr
      - --bindir=/usr/bin
      - --libdir=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}
    stage:
      - usr/bin/mosh-server
      - usr/bin/mosh
      - usr/lib/

  squashfs-tools:
    plugin: make
    source: https://github.com/plougher/squashfs-tools.git
    source-type: git
    source-subdir: squashfs-tools
    make-parameters:
      - INSTALL_PREFIX=${CRAFT_PART_INSTALL}/usr
    override-pull: |
      # pull the latest tag
      craftctl default
      git_url="https://github.com/plougher/squashfs-tools.git"
      tag=$(git ls-remote --tags --refs  --sort='version:refname' "${git_url}" "refs/tags/4.*" | tail -1 | awk '{print $2}' | cut -c 11-)
      echo "building tag: ${tag}"
      git checkout "${tag}"
    stage:
      - usr/bin

  squashfs-delta:
    plugin: dump
    source: https://github.com/kubiko/squashfs-delta.git
    source-type: git
    source-branch: master
    override-build: |
      go build -o "${CRAFT_PART_INSTALL}/squashfs-delta" snap-delta.go
      strip "${CRAFT_PART_INSTALL}/squashfs-delta"
      ln -sf squashfs-delta ${CRAFT_PART_INSTALL}/snap-delta
    organize:
      '*': usr/bin/
    stage:
      - usr/bin/squashfs-delta*
      - usr/bin/snap-delta*

  tiobench:
    plugin: nil
    source: https://github.com/mkuoppal/tiobench.git
    source-type: git
    override-build: |
      make -j$(nproc)
      install -D -m 0755 tiobench.pl         ${CRAFT_PART_INSTALL}/usr/bin/tiobench.pl
      install -D -m 0755 tiotest             ${CRAFT_PART_INSTALL}/usr/bin/tiotest
      install -D -m 0755 scripts/bigbench.sh ${CRAFT_PART_INSTALL}/usr/bin/bigbench.sh
      install -D -m 0755 scripts/tiosum.pl   ${CRAFT_PART_INSTALL}/usr/bin/tiosum.pl
      install -D -m 0644 README.md           ${CRAFT_PART_INSTALL}/usr/doc/tiobench/README.md
      install -D -m 0644 scripts/README      ${CRAFT_PART_INSTALL}/usr/doc/tiobench/README

  hdiff:
    plugin: dump
    source: https://api.github.com/repos/sisong/HDiffPatch/releases/latest
    source-type: zip
    override-pull: |
      if [ "armhf" = "${CRAFT_ARCH_BUILD_FOR}" ]; then
        linux_flavour="linux_arm32"
      elif [ "arm64" = "${CRAFT_ARCH_BUILD_FOR}" ]; then
        linux_flavour="linux_arm64"
      elif [ "amd64" = "${CRAFT_ARCH_BUILD_FOR}" ]; then
        linux_flavour="linux64"
      elif [ "riscv64" = "${CRAFT_ARCH_BUILD_FOR}" ]; then
        linux_flavour="linux_riscv64"
      fi
      if [ -n "${linux_flavour}" ]; then
        url=$(curl -sL https://api.github.com/repos/sisong/HDiffPatch/releases/latest | jq -r '.assets[].browser_download_url' | grep "${linux_flavour}")
        wget --quiet -O "${CRAFT_PART_SRC}/hdiffpatch_linux.zip" "${url}"
        unzip -j "${CRAFT_PART_SRC}/hdiffpatch_linux.zip"
        chmod 755 *
      fi
    organize:
      '*': usr/bin/
    stage:
      - -usr/bin/*.zip

  eza:
    plugin: rust
    source: https://github.com/eza-community/eza.git
    source-type: git
    source-branch: main
    organize:
      bin: usr/bin

  # ioctl:
  #   plugin: make
  #   source: https://github.com/jerome-pouiller/ioctl.git
  #   source-type: git
  #   source-branch: master
  #   override-build: |
  #     if [ -z $(uname -a | grep "ppc64el") ]; then
  #       craftctl default
  #     fi

build-snaps:
  - go/latest/stable

build-packages:
  - cmake
  - curl
  - g++
  - gawk
  - gettext
  - help2man
  - jq
  - libboost-dev
  - libext2fs-dev
  - libglib2.0-dev
  - libgpm-dev
  - libltdl-dev
  - liblz4-dev
  - liblzma-dev
  - liblzo2-dev
  - libncurses5-dev
  - libnuma-dev
  - libprotobuf-dev
  - libslang2-dev
  - libssl-dev
  - libtool
  - libudev-dev
  - libz-dev
  - libzstd-dev
  - pkg-config
  - protobuf-compiler
  - texinfo
  - unzip
  - wget
  - zlib1g
  - zlib1g-dev
